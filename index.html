<script>
// Reload onto the newest build when a deploy lands, so cached pages never linger.
(function () {
  var V = '24';
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || String(j.v) === V) return;
      try { if (sessionStorage.getItem('reload-' + j.v)) return; sessionStorage.setItem('reload-' + j.v, '1'); } catch (e) {}
      var u = new URL(location.href); u.searchParams.set('v', j.v); location.replace(u.toString());
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
